name: tuja_helper
description: 한국투자증권 OpenAPI 기반 주식투자 보조 앱
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=2.18.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 상태관리
  flutter_riverpod: ^2.1.3

  # 네비게이션
  go_router: ^6.5.6

  # HTTP
  dio: ^5.0.3

  # 보안 스토리지
  flutter_secure_storage: ^8.0.0

  # 푸시 알림
  firebase_core: ^2.4.1
  firebase_messaging: ^14.2.5

  # 기타 유틸
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  mocktail: ^0.3.0

flutter:
  uses-material-design: true
