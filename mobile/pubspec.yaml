name: tuja_helper
description: 한국투자증권 OpenAPI 기반 주식투자 보조 앱
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 상태관리
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 네비게이션
  go_router: ^14.1.4

  # HTTP
  dio: ^5.4.3+1

  # 보안 스토리지
  flutter_secure_storage: ^9.2.2

  # 푸시 알림
  firebase_core: ^3.1.1
  firebase_messaging: ^15.0.4

  # 차트
  fl_chart: ^0.68.0

  # 기타 유틸
  intl: ^0.19.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
