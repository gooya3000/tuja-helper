spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    secret: test-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
    access-token-expiry-ms: 1800000
    refresh-token-expiry-ms: 604800000

  encryption:
    key: test-aes-key-32bytes!!!!!!!!

  kis:
    base-url: https://openapivts.koreainvestment.com:29443
    websocket-url: ws://ops.koreainvestment.com:31000

  firebase:
    credentials-path: firebase-service-account.json

logging:
  level:
    com.tujahelper: DEBUG
    org.springframework.security: INFO
